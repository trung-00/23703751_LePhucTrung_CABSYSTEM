openapi: 3.0.0
info:
  title: Payment API
  description: API quản lý thanh toán chuyến đi.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local server
paths:
  /payments:
    get:
      summary: Lấy danh sách thanh toán
      operationId: getPayments
      tags: [Payments]
      responses:
        '200':
          description: Danh sách thanh toán
    post:
      summary: Tạo yêu cầu thanh toán
      operationId: createPayment
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Tạo thanh toán thành công
  /payments/{payment_id}:
    get:
      summary: Lấy thông tin thanh toán
      operationId: getPaymentById
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Tìm thấy thanh toán
    put:
      summary: Cập nhật trạng thái thanh toán
      operationId: updatePayment
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
components:
  parameters:
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    PaymentRequest:
      type: object
      required: [trip_id, method, amount]
      properties:
        trip_id:
          type: integer
        method:
          type: string
          enum: [cash, electronic]
        amount:
          type: number
          format: double
    PaymentUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        transaction_id:
          type: string
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentRequest'
        - $ref: '#/components/schemas/PaymentUpdateRequest'
        - type: object
          properties:
            payment_id:
              type: integer
