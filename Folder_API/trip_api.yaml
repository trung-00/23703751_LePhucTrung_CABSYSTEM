openapi: 3.0.0
info:
  title: Trip Management API
  description: API đặt xe và quản lý chuyến đi.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local server
paths:
  /trips:
    get:
      summary: Lấy danh sách chuyến đi
      operationId: getTrips
      tags: [Trips]
      responses:
        '200':
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
    post:
      summary: Tạo yêu cầu đặt xe
      operationId: createTrip
      tags: [Trips]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
  /trips/{trip_id}:
    get:
      summary: Lấy thông tin chuyến đi
      operationId: getTripById
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Tìm thấy chuyến đi
    put:
      summary: Cập nhật trạng thái chuyến đi
      operationId: updateTrip
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdateRequest'
      responses:
        '200':
          description: Cập nhật chuyến đi thành công
    delete:
      summary: Hủy chuyến đi
      operationId: cancelTrip
      tags: [Trips]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '204':
          description: Hủy chuyến thành công
components:
  parameters:
    TripId:
      name: trip_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    TripRequest:
      type: object
      required: [customer_id, pickup_location, destination, vehicle_type_id]
      properties:
        customer_id:
          type: integer
        pickup_location:
          type: string
        destination:
          type: string
        vehicle_type_id:
          type: integer
    TripUpdateRequest:
      type: object
      properties:
        driver_id:
          type: integer
        status:
          type: string
          enum: [searching, assigned, accepted, arrived, picked_up, in_progress, completed, cancelled]
        current_location:
          type: string
    Trip:
      allOf:
        - $ref: '#/components/schemas/TripRequest'
        - $ref: '#/components/schemas/TripUpdateRequest'
        - type: object
          properties:
            trip_id:
              type: integer
              format: int64
            fare:
              type: number
              format: double
