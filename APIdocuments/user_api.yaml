openapi: 3.0.0

info:
  title: User Management API
  description: API quản lý người dùng, bao gồm tạo mới, lấy danh sách và xóa người dùng.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

tags:
  - name: Users
    description: Các API quản lý người dùng

paths:
  /users:
    post:
      summary: Tạo người dùng mới
      description: Tạo một tài khoản người dùng mới trong hệ thống.
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        description: Thông tin người dùng cần tạo
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Tạo người dùng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu đầu vào không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username hoặc email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi máy chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      summary: Lấy danh sách người dùng
      description: Trả về danh sách tất cả người dùng trong hệ thống.
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: Lấy danh sách người dùng thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Lỗi máy chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{user_id}:
    delete:
      summary: Xóa người dùng
      description: Xóa một người dùng dựa trên ID.
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: user_id
          in: path
          required: true
          description: ID của người dùng cần xóa
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Xóa người dùng thành công
        '400':
          description: user_id không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tìm thấy người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Lỗi máy chủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      description: Thông tin người dùng
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: nguyenvana
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        age:
          type: integer
          format: int32
          minimum: 1
          example: 21
        gender:
          type: string
          enum:
            - male
            - female
            - other
          example: male
      required:
        - id
        - username
        - email

    CreateUserRequest:
      type: object
      description: Dữ liệu dùng để tạo người dùng mới
      properties:
        username:
          type: string
          minLength: 3
          example: nguyenvana
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com
        age:
          type: integer
          format: int32
          minimum: 1
          example: 21
        gender:
          type: string
          enum:
            - male
            - female
            - other
          example: male
        password:
          type: string
          format: password
          minLength: 8
          example: MatKhau123
      required:
        - username
        - email
        - password

    Error:
      type: object
      description: Cấu trúc phản hồi lỗi
      properties:
        error_code:
          type: string
          example: USER_NOT_FOUND
        message:
          type: string
          example: Không tìm thấy người dùng
      required:
        - error_code
        - message
