aopenapi: 3.0.0
info:
  title: Business Report API
  description: API tổng hợp và xem báo cáo hoạt động kinh doanh.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local server
paths:
  /reports/trips:
    get:
      summary: Báo cáo số lượng chuyến đi
      operationId: getTripReport
      tags: [Reports]
      parameters:
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Báo cáo chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripReport'
  /reports/revenue:
    get:
      summary: Báo cáo doanh thu
      operationId: getRevenueReport
      tags: [Reports]
      parameters:
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Báo cáo doanh thu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueReport'
components:
  schemas:
    TripReport:
      type: object
      properties:
        total_trips:
          type: integer
        completed_trips:
          type: integer
        cancelled_trips:
          type: integer
    RevenueReport:
      type: object
      properties:
        total_revenue:
          type: number
          format: double
        total_payments:
          type: integer
