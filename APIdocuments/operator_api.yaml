openapi: 3.0.0
info:
  title: Operator Management API
  description: API quản lý nhân viên vận hành.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local server
paths:
  /operators:
    get:
      summary: Lấy danh sách nhân viên vận hành
      operationId: getOperators
      tags: [Operators]
      responses:
        '200':
          description: Danh sách nhân viên
    post:
      summary: Tạo nhân viên vận hành
      operationId: createOperator
      tags: [Operators]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRequest'
      responses:
        '201':
          description: Tạo nhân viên thành công
  /operators/{operator_id}:
    get:
      summary: Lấy nhân viên theo ID
      operationId: getOperatorById
      tags: [Operators]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      responses:
        '200':
          description: Tìm thấy nhân viên
    put:
      summary: Cập nhật nhân viên
      operationId: updateOperator
      tags: [Operators]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRequest'
      responses:
        '200':
          description: Cập nhật thành công
    delete:
      summary: Xóa nhân viên
      operationId: deleteOperator
      tags: [Operators]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
      responses:
        '204':
          description: Xóa nhân viên thành công
components:
  parameters:
    OperatorId:
      name: operator_id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    OperatorRequest:
      type: object
      required: [full_name, email, role]
      properties:
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [operator, manager]
    Operator:
      allOf:
        - $ref: '#/components/schemas/OperatorRequest'
        - type: object
          properties:
            operator_id:
              type: integer
