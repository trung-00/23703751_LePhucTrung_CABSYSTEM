openapi: 3.0.0
info:
  title: Vehicle Management API
  description: API quản lý phương tiện.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local server
paths:
  /vehicles:
    get:
      summary: Lấy danh sách phương tiện
      operationId: getVehicles
      tags: [Vehicles]
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      summary: Thêm phương tiện
      operationId: createVehicle
      tags: [Vehicles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '201':
          description: Thêm phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
  /vehicles/{vehicle_id}:
    get:
      summary: Lấy phương tiện theo ID
      operationId: getVehicleById
      tags: [Vehicles]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Tìm thấy phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
    put:
      summary: Cập nhật phương tiện
      operationId: updateVehicle
      tags: [Vehicles]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'
      responses:
        '200':
          description: Cập nhật thành công
    delete:
      summary: Xóa phương tiện
      operationId: deleteVehicle
      tags: [Vehicles]
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Xóa thành công
components:
  parameters:
    VehicleId:
      name: vehicle_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    VehicleRequest:
      type: object
      required: [driver_id, vehicle_type_id, license_plate]
      properties:
        driver_id:
          type: integer
        vehicle_type_id:
          type: integer
        license_plate:
          type: string
        brand:
          type: string
        color:
          type: string
        status:
          type: string
    Vehicle:
      allOf:
        - $ref: '#/components/schemas/VehicleRequest'
        - type: object
          properties:
            vehicle_id:
              type: integer
              format: int64
