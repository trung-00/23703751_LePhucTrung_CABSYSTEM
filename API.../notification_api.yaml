openapi: 3.0.0
info:
  title: Notification API
  description: API quản lý thông báo cho khách hàng và tài xế.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local server
paths:
  /notifications:
    get:
      summary: Lấy danh sách thông báo
      operationId: getNotifications
      tags: [Notifications]
      responses:
        '200':
          description: Danh sách thông báo
    post:
      summary: Tạo thông báo
      operationId: createNotification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '201':
          description: Tạo thông báo thành công
  /notifications/{notification_id}:
    get:
      summary: Lấy thông báo theo ID
      operationId: getNotificationById
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Tìm thấy thông báo
    patch:
      summary: Đánh dấu thông báo đã đọc
      operationId: markNotificationAsRead
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [read, unread]
      responses:
        '200':
          description: Cập nhật trạng thái thông báo thành công
    delete:
      summary: Xóa thông báo
      operationId: deleteNotification
      tags: [Notifications]
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '204':
          description: Xóa thông báo thành công
components:
  parameters:
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    NotificationRequest:
      type: object
      required: [message, notification_type]
      properties:
        customer_id:
          type: integer
        driver_id:
          type: integer
        message:
          type: string
        notification_type:
          type: string
        status:
          type: string
          enum: [read, unread]
    Notification:
      allOf:
        - $ref: '#/components/schemas/NotificationRequest'
        - type: object
          properties:
            notification_id:
              type: integer
